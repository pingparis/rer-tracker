<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Suivi RER C · D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EDEEE8;
    --card:#FFFFFF;
    --ink:#1B1D1B;
    --muted:#6B6F68;
    --border:#DBDDD3;
    --line-c:#FFCE00;
    --line-c-ink:#4A3900;
    --line-d:#00814F;
    --line-d-ink:#FFFFFF;
    --sev-0:#E3E5DD;
    --sev-0-ink:#6B6F68;
    --sev-1:#F5C453;
    --sev-1-ink:#5A4004;
    --sev-2:#EE8C3D;
    --sev-2-ink:#4A2604;
    --sev-3:#D6483F;
    --sev-3-ink:#FFFFFF;
    --accent-bg:#1B1D1B;
    --accent-ink:#FFFFFF;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1A1B18;
      --card:#232420;
      --ink:#ECEDE7;
      --muted:#9A9D93;
      --border:#34362F;
      --line-c:#FFCE00;
      --line-c-ink:#2B2100;
      --line-d:#1FA972;
      --line-d-ink:#0A1C13;
      --sev-0:#33352E;
      --sev-0-ink:#A7A99C;
      --sev-1:#D9A73E;
      --sev-1-ink:#241900;
      --sev-2:#D97A2E;
      --sev-2-ink:#2A1400;
      --sev-3:#C23D35;
      --sev-3-ink:#FFFFFF;
      --accent-bg:#ECEDE7;
      --accent-ink:#1A1B18;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  #app{max-width:480px;margin:0 auto;padding:16px 16px 96px;min-height:100vh;}
  h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;margin:0;}
  .num,.mono{font-family:'IBM Plex Mono',monospace;}

  header.top{padding:8px 0 18px;}
  header.top h1{font-size:20px;letter-spacing:-0.01em;}
  header.top p{margin:4px 0 0;font-size:13px;color:var(--muted);}
  .profile-tag{font-size:12px;}
  .link-btn{background:none;border:none;padding:0;color:var(--ink);text-decoration:underline;font-size:12px;font-family:'Inter';}
  .profile-btn{display:block;width:100%;padding:14px;margin-bottom:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-family:'Space Grotesk';font-size:15px;font-weight:600;color:var(--ink);}
  .profile-btn:last-child{margin-bottom:0;}

  .roundel{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-family:'Space Grotesk';font-weight:700;font-size:13px;flex-shrink:0;}
  .roundel.c{background:var(--line-c);color:var(--line-c-ink);}
  .roundel.d{background:var(--line-d);color:var(--line-d-ink);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}

  .date-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .date-nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:16px;color:var(--ink);}
  .date-nav .date-label{flex:1;text-align:center;font-size:14px;}
  .date-nav .date-label .today-tag{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .trip-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .trip-title i{font-size:15px;color:var(--muted);}
  .trip-title span{font-size:14px;font-weight:600;}
  .absent-btn{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:500;}
  .absent-btn.active{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-bg);}
  .bulk-card summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;color:var(--ink);}
  .bulk-card summary::-webkit-details-marker{display:none;}
  .bulk-card summary::before{content:'+ ';color:var(--muted);font-weight:700;}
  .bulk-card[open] summary::before{content:'– ';}
  .bulk-card[open] summary{margin-bottom:2px;}

  .line-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .line-row:last-child{margin-bottom:0;}
  .line-row .roundel{margin-right:2px;}
  .sev-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1;}
  .sev-btn{border:1px solid var(--border);background:var(--sev-0);color:var(--sev-0-ink);border-radius:8px;padding:7px 2px;font-size:11px;font-weight:500;text-align:center;line-height:1.2;}
  .sev-btn.active[data-lvl="aucune"]{background:var(--sev-0);color:var(--sev-0-ink);border-color:var(--sev-0);}
  .sev-btn.active[data-lvl="faible"]{background:var(--sev-1);color:var(--sev-1-ink);border-color:var(--sev-1);}
  .sev-btn.active[data-lvl="forte"]{background:var(--sev-2);color:var(--sev-2-ink);border-color:var(--sev-2);}
  .sev-btn.active[data-lvl="tres_forte"]{background:var(--sev-3);color:var(--sev-3-ink);border-color:var(--sev-3);}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1B1D1B;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:.92;}

  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;max-width:480px;margin:0 auto;}
  nav.bottom button{flex:1;padding:12px 0 10px;background:none;border:none;font-family:'Inter';font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.bottom button i{font-size:19px;}
  nav.bottom button.active{color:var(--ink);font-weight:600;}

  .tabs-period{display:flex;gap:6px;margin-bottom:16px;}
  .tabs-period button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--muted);font-weight:500;}
  .tabs-period button.active{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-bg);}

  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .metric .value{font-size:22px;font-weight:600;margin-top:4px;}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-daylabel{font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px;}
  .cal-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'IBM Plex Mono';}
  .cal-cell.blank{visibility:hidden;}
  .cal-cell.weekend{background:transparent;color:var(--border);}
  .cal-cell.future{background:var(--bg);border:1px dashed var(--border);color:var(--muted);}
  .cal-cell.absent-day{background:var(--card);border:1px dashed var(--border);color:var(--muted);cursor:pointer;}
  .cal-cell.sev-0{background:var(--sev-0);color:var(--sev-0-ink);cursor:pointer;}
  .cal-cell.sev-1{background:var(--sev-1);color:var(--sev-1-ink);cursor:pointer;}
  .cal-cell.sev-2{background:var(--sev-2);color:var(--sev-2-ink);cursor:pointer;}
  .cal-cell.sev-3{background:var(--sev-3);color:var(--sev-3-ink);cursor:pointer;}

  .chart-box{position:relative;height:180px;width:100%;}
  canvas{display:block;}

  .section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:20px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:10px 0;}

  .reset-link{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:24px;text-decoration:underline;background:none;border:none;width:100%;}

  .icon-btn{background:none;border:none;font-size:18px;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ====== CONFIGURATION FIREBASE ======
// 1) Colle ici la configuration copiée depuis la console Firebase
//    (Paramètres du projet > Vos applications > SDK config)
const firebaseConfig = {
  apiKey: "AIzaSyBgX0svuFBWREb9KK7rU68OdWnllxDHDZI",
  authDomain: "rer-tracker.firebaseapp.com",
  projectId: "rer-tracker",
  storageBucket: "rer-tracker.firebasestorage.app",
  messagingSenderId: "190400375272",
  appId: "1:190400375272:web:f39a4f3a365b7a99031c5d"
};
// 2) Liste des profils. Chaque profil a un identifiant secret (lettres/chiffres,
//    sans espace) et un nom affiché. Ajoute-en autant que besoin.
const PROFILES = [
  {id:"Tornado-RER", name:"Jules"},
  {id:"Amelie-RER", name:"Amélie"}
];
// =====================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({experimentalAutoDetectLongPolling: true, merge: true});

let currentProfile = null;
let monthsRef = null;

const LEVELS = ['aucune','faible','forte','tres_forte'];
const LEVEL_LABELS = {aucune:'Aucune', faible:'Faible', forte:'Forte', tres_forte:'Très forte'};
const monthCache = {};
let currentTab = 'log';
let selectedDate = todayStr();
let statsWindow = 'week';
let calendarMonth = todayStr().slice(0,7);

function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ymOf(dateStr){return dateStr.slice(0,7);}
function dateFromStr(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(dateStr,n){const d=dateFromStr(dateStr);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function isWeekday(dateStr){const day=dateFromStr(dateStr).getDay();return day>=1&&day<=5;}
function frDate(dateStr){const d=dateFromStr(dateStr);return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

async function loadMonth(ym){
  if(monthCache[ym]) return monthCache[ym];
  try{
    const doc = await monthsRef.doc(ym).get();
    monthCache[ym] = doc.exists && doc.data().payload ? JSON.parse(doc.data().payload) : {};
  }catch(e){
    monthCache[ym] = {};
    showToast('Connexion impossible, verifie ta config Firebase');
  }
  return monthCache[ym];
}
async function saveMonth(ym){
  try{
    await monthsRef.doc(ym).set({payload: JSON.stringify(monthCache[ym])});
  }catch(e){
    showToast("Erreur d'enregistrement");
  }
}

function getTrip(dateStr, period){
  const ym = ymOf(dateStr);
  const data = monthCache[ym] || {};
  const day = data[dateStr];
  if(!day || !day[period]) return {c:'aucune', d:'aucune', absent:false};
  return day[period];
}

async function setTripLevel(dateStr, period, line, level){
  const ym = ymOf(dateStr);
  await loadMonth(ym);
  const data = monthCache[ym];
  if(!data[dateStr]) data[dateStr] = {};
  if(!data[dateStr][period]) data[dateStr][period] = {c:'aucune', d:'aucune'};
  data[dateStr][period][line] = level;
  const t = data[dateStr][period];
  if(t.c==='aucune' && t.d==='aucune' && !t.absent){
    delete data[dateStr][period];
    if(Object.keys(data[dateStr]).length===0) delete data[dateStr];
  }
  await saveMonth(ym);
  showToast('Enregistré');
  renderLog();
}

async function setTripAbsent(dateStr, period, value){
  const ym = ymOf(dateStr);
  await loadMonth(ym);
  const data = monthCache[ym];
  if(value){
    if(!data[dateStr]) data[dateStr] = {};
    data[dateStr][period] = {c:'aucune', d:'aucune', absent:true};
  } else {
    if(data[dateStr]){
      delete data[dateStr][period];
      if(Object.keys(data[dateStr]).length===0) delete data[dateStr];
    }
  }
  await saveMonth(ym);
  showToast(value ? 'Trajet marqué non effectué' : 'Trajet réactivé');
  renderLog();
}

async function bulkMarkAbsent(startDate, endDate){
  const yms = new Set();
  let cursor = startDate;
  while(cursor <= endDate){
    yms.add(ymOf(cursor));
    cursor = addDays(cursor, 1);
  }
  await Promise.all([...yms].map(loadMonth));
  cursor = startDate;
  let count = 0;
  while(cursor <= endDate){
    if(isWeekday(cursor)){
      const ym = ymOf(cursor);
      const data = monthCache[ym];
      if(!data[cursor]) data[cursor] = {};
      data[cursor]['matin'] = {c:'aucune', d:'aucune', absent:true};
      data[cursor]['soir'] = {c:'aucune', d:'aucune', absent:true};
      count++;
    }
    cursor = addDays(cursor, 1);
  }
  await Promise.all([...yms].map(saveMonth));
  showToast(count+' jour(s) marqué(s) non travaillé(s)');
  renderLog();
}

function bulkMarkAbsentFromInputs(){
  let start = document.getElementById('bulk-start').value;
  const end = document.getElementById('bulk-end').value;
  if(!start || !end){ showToast('Choisis une date de début et de fin'); return; }
  if(start > end){ showToast('La date de fin doit être après le début'); return; }
  if(start > todayStr()) start = todayStr();
  if(!confirm('Marquer tous les jours ouvrés du '+frDate(start)+' au '+frDate(end)+' comme non travaillés ?\n\nCela écrasera les perturbations déjà enregistrées sur cette période.')) return;
  bulkMarkAbsent(start, end);
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 1400);
}

function profileName(id){
  const p = PROFILES.find(p=>p.id===id);
  return p ? p.name : id;
}

function renderProfileSelect(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <h1>Suivi RER C · D</h1>
      <p>Qui es-tu ?</p>
    </header>
    <div class="card">
      ${PROFILES.map(p=>`<button class="profile-btn" onclick="chooseProfile('${p.id}')">${p.name}</button>`).join('')}
    </div>
  `;
}

function chooseProfile(id){
  localStorage.setItem('rer-tracker:profile', id);
  currentProfile = id;
  monthsRef = db.collection('rer-tracker').doc(currentProfile).collection('months');
  for(const k in monthCache) delete monthCache[k];
  document.getElementById('app').innerHTML = '<p class="empty-hint" style="padding-top:40px;">Chargement…</p>';
  renderLog();
}

function switchProfile(){
  localStorage.removeItem('rer-tracker:profile');
  currentProfile = null;
  monthsRef = null;
  for(const k in monthCache) delete monthCache[k];
  renderProfileSelect();
}

function initApp(){
  const saved = localStorage.getItem('rer-tracker:profile');
  if(saved && PROFILES.find(p=>p.id===saved)){
    currentProfile = saved;
    monthsRef = db.collection('rer-tracker').doc(currentProfile).collection('months');
    document.getElementById('app').innerHTML = '<p class="empty-hint" style="padding-top:40px;">Chargement…</p>';
    renderLog();
  } else {
    renderProfileSelect();
  }
}

function severityBtns(dateStr, period, line, current){
  return LEVELS.map(lvl=>{
    const active = current===lvl ? 'active' : '';
    return `<button class="sev-btn ${active}" data-lvl="${lvl}" onclick="setTripLevel('${dateStr}','${period}','${line}','${lvl}')">${LEVEL_LABELS[lvl]}</button>`;
  }).join('');
}

async function renderLog(){
  const app = document.getElementById('app');
  const ym = ymOf(selectedDate);
  await loadMonth(ym);
  const matin = getTrip(selectedDate,'matin');
  const soir = getTrip(selectedDate,'soir');
  const isToday = selectedDate===todayStr();

  app.innerHTML = `
    <header class="top">
      <h1>Suivi RER C · D</h1>
      <p>Bibliothèque F. Mitterrand ↔ Bras de Fer</p>
      <p class="profile-tag">Profil : <strong>${profileName(currentProfile)}</strong> · <button class="link-btn" onclick="switchProfile()">changer</button></p>
    </header>

    <div class="date-nav">
      <button onclick="changeDate(-1)">‹</button>
      <div class="date-label">
        ${capitalize(frDate(selectedDate))}
        ${isToday ? '<span class="today-tag">Aujourd’hui</span>' : ''}
      </div>
      <button onclick="changeDate(1)" ${selectedDate>=todayStr()?'disabled style="opacity:.3"':''}>›</button>
    </div>

    <div class="card">
      <div class="trip-title">
        <span>Trajet du matin</span>
        <button class="absent-btn ${matin.absent?'active':''}" onclick="setTripAbsent('${selectedDate}','matin',${!matin.absent})">${matin.absent ? '✓ Non effectué' : 'Non effectué'}</button>
      </div>
      <div class="line-row" style="${matin.absent?'opacity:.35;pointer-events:none;':''}">
        <span class="roundel c">C</span>
        <div class="sev-buttons">${severityBtns(selectedDate,'matin','c',matin.c)}</div>
      </div>
      <div class="line-row" style="${matin.absent?'opacity:.35;pointer-events:none;':''}">
        <span class="roundel d">D</span>
        <div class="sev-buttons">${severityBtns(selectedDate,'matin','d',matin.d)}</div>
      </div>
    </div>

    <div class="card">
      <div class="trip-title">
        <span>Trajet du soir</span>
        <button class="absent-btn ${soir.absent?'active':''}" onclick="setTripAbsent('${selectedDate}','soir',${!soir.absent})">${soir.absent ? '✓ Non effectué' : 'Non effectué'}</button>
      </div>
      <div class="line-row" style="${soir.absent?'opacity:.35;pointer-events:none;':''}">
        <span class="roundel c">C</span>
        <div class="sev-buttons">${severityBtns(selectedDate,'soir','c',soir.c)}</div>
      </div>
      <div class="line-row" style="${soir.absent?'opacity:.35;pointer-events:none;':''}">
        <span class="roundel d">D</span>
        <div class="sev-buttons">${severityBtns(selectedDate,'soir','d',soir.d)}</div>
      </div>
    </div>

    <p class="empty-hint">Rien à faire si le trajet s'est bien passé — seule une perturbation doit être notée. Utilise "Non effectué" si tu n'as pas pris le RER ce jour-là.</p>

    <details class="card bulk-card">
      <summary>Marquer une période non travaillée</summary>
      <div style="display:flex;gap:8px;margin:10px 0;">
        <input type="date" id="bulk-start" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);font-family:'Inter';font-size:13px;background:var(--card);color:var(--ink);">
        <input type="date" id="bulk-end" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);font-family:'Inter';font-size:13px;background:var(--card);color:var(--ink);">
      </div>
      <button class="absent-btn" style="width:100%;padding:10px;" onclick="bulkMarkAbsentFromInputs()">Marquer cette période comme non travaillée</button>
    </details>

    ${bottomNav()}
  `;
}

function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function changeDate(delta){
  const nd = addDays(selectedDate, delta);
  if(nd>todayStr()) return;
  selectedDate = nd;
  renderLog();
}

function bottomNav(){
  return `
    <nav class="bottom">
      <button class="${currentTab==='log'?'active':''}" onclick="switchTab('log')"><i class="ti">🚆</i>Enregistrer</button>
      <button class="${currentTab==='stats'?'active':''}" onclick="switchTab('stats')"><i class="ti">📊</i>Statistiques</button>
    </nav>
  `;
}

function switchTab(tab){
  currentTab = tab;
  if(tab==='log') renderLog();
  else renderStats();
}

// ---------- STATS ----------

function currentPeriodDays(period){
  const today = todayStr();
  let start;
  if(period==='week'){
    const d = dateFromStr(today);
    const dow = d.getDay(); // 0=dimanche..6=samedi
    const diffToMonday = dow===0 ? 6 : dow-1;
    const monday = new Date(d);
    monday.setDate(d.getDate()-diffToMonday);
    start = monday.getFullYear()+'-'+pad(monday.getMonth()+1)+'-'+pad(monday.getDate());
  } else if(period==='month'){
    start = today.slice(0,7)+'-01';
  } else {
    start = today.slice(0,4)+'-01-01';
  }
  const days = [];
  let cursor = start;
  while(cursor <= today){
    if(isWeekday(cursor)) days.push(cursor);
    cursor = addDays(cursor,1);
  }
  return days;
}

async function computeStats(period){
  const days = currentPeriodDays(period);
  const yms = [...new Set(days.map(ymOf))];
  await Promise.all(yms.map(loadMonth));

  const countsC = {aucune:0, faible:0, forte:0, tres_forte:0};
  const countsD = {aucune:0, faible:0, forte:0, tres_forte:0};
  let totalTrips = 0;
  let perturbedTrips = 0;
  const weight = {aucune:0, faible:1, forte:2, tres_forte:3};
  let scoreC = 0, scoreD = 0;

  days.forEach(dateStr=>{
    ['matin','soir'].forEach(period=>{
      const t = getTrip(dateStr, period);
      if(t.absent) return;
      totalTrips++;
      countsC[t.c]++;
      countsD[t.d]++;
      scoreC += weight[t.c];
      scoreD += weight[t.d];
      if(t.c!=='aucune' || t.d!=='aucune') perturbedTrips++;
    });
  });

  return {days, totalTrips, perturbedTrips, countsC, countsD, scoreC, scoreD};
}

function calendarMonthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return capitalize(d.toLocaleDateString('fr-FR',{month:'long', year:'numeric'}));
}

function shiftMonth(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  if(m<1){m=12;y--;}
  if(m>12){m=1;y++;}
  return y+'-'+pad(m);
}

function calendarCellHtml(dateStr, todayS){
  const dow = dateFromStr(dateStr).getDay();
  const dayNum = parseInt(dateStr.slice(8,10),10);
  if(dow===0 || dow===6){
    return `<div class="cal-cell weekend">${dayNum}</div>`;
  }
  if(dateStr > todayS){
    return `<div class="cal-cell future">${dayNum}</div>`;
  }
  const weight = {aucune:0, faible:1, forte:2, tres_forte:3};
  const matin = getTrip(dateStr,'matin');
  const soir = getTrip(dateStr,'soir');
  const included = [matin,soir].filter(t=>!t.absent);
  if(included.length===0){
    return `<div class="cal-cell absent-day" onclick="goToDate('${dateStr}')">${dayNum}</div>`;
  }
  let maxW = 0;
  included.forEach(t=>{ maxW = Math.max(maxW, weight[t.c], weight[t.d]); });
  return `<div class="cal-cell sev-${maxW}" onclick="goToDate('${dateStr}')">${dayNum}</div>`;
}

async function renderCalendarGrid(ym){
  await loadMonth(ym);
  const [y,m] = ym.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  let startOffset = firstDay.getDay();
  startOffset = startOffset===0 ? 6 : startOffset-1;
  const todayS = todayStr();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div class="cal-cell blank"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = y+'-'+pad(m)+'-'+pad(day);
    cells += calendarCellHtml(dateStr, todayS);
  }
  return cells;
}

async function renderCalendarSection(){
  const labelEl = document.getElementById('cal-label');
  const nextBtn = document.getElementById('cal-next-btn');
  if(!labelEl) return;
  const isCurrentOrFuture = calendarMonth >= todayStr().slice(0,7);
  labelEl.textContent = calendarMonthLabel(calendarMonth);
  nextBtn.disabled = isCurrentOrFuture;
  nextBtn.style.opacity = isCurrentOrFuture ? .3 : 1;
  document.getElementById('cal-days').innerHTML = await renderCalendarGrid(calendarMonth);
}

function calShift(delta){
  calendarMonth = shiftMonth(calendarMonth, delta);
  renderCalendarSection();
}

function goToDate(dateStr){
  selectedDate = dateStr;
  currentTab = 'log';
  renderLog();
}

let chartC, chartD;

async function renderStats(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <h1>Statistiques</h1>
      <p>Trajets domicile-travail, jours ouvrés</p>
      <p class="profile-tag">Profil : <strong>${profileName(currentProfile)}</strong> · <button class="link-btn" onclick="switchProfile()">changer</button></p>
    </header>
    <div class="tabs-period">
      <button data-w="week" class="${statsWindow==='week'?'active':''}" onclick="setWindow('week')">Semaine</button>
      <button data-w="month" class="${statsWindow==='month'?'active':''}" onclick="setWindow('month')">Mois</button>
      <button data-w="year" class="${statsWindow==='year'?'active':''}" onclick="setWindow('year')">Année</button>
    </div>
    <div id="stats-body"><p class="empty-hint">Chargement…</p></div>
    ${bottomNav()}
  `;

  const stats = await computeStats(statsWindow);
  const pct = stats.totalTrips ? Math.round(100*stats.perturbedTrips/stats.totalTrips) : 0;
  const okPct = 100-pct;
  const period0 = frDate(stats.days[0]);
  const periodN = frDate(stats.days[stats.days.length-1]);

  const dominant = stats.scoreC===stats.scoreD ? 'équivalentes' : (stats.scoreC>stats.scoreD ? 'la ligne C se perturbe davantage' : 'la ligne D se perturbe davantage');

  const body = document.getElementById('stats-body');
  body.innerHTML = `
    <div class="metric-grid">
      <div class="metric">
        <div class="label">Trajets suivis</div>
        <div class="value num">${stats.totalTrips}</div>
      </div>
      <div class="metric">
        <div class="label">Sans incident</div>
        <div class="value num">${okPct}%</div>
      </div>
      <div class="metric">
        <div class="label">Avec perturbation</div>
        <div class="value num">${pct}%</div>
      </div>
      <div class="metric">
        <div class="label">Comparaison</div>
        <div class="value" style="font-size:13px;font-weight:500;line-height:1.3;">${capitalize(dominant)}</div>
      </div>
    </div>

    <div class="section-title">RER C</div>
    <div class="card">
      <div class="chart-box"><canvas id="chartC"></canvas></div>
      <div class="legend">
        <span><i style="background:var(--sev-0)"></i>Aucune ${stats.countsC.aucune}</span>
        <span><i style="background:var(--sev-1)"></i>Faible ${stats.countsC.faible}</span>
        <span><i style="background:var(--sev-2)"></i>Forte ${stats.countsC.forte}</span>
        <span><i style="background:var(--sev-3)"></i>Très forte ${stats.countsC.tres_forte}</span>
      </div>
    </div>

    <div class="section-title">RER D</div>
    <div class="card">
      <div class="chart-box"><canvas id="chartD"></canvas></div>
      <div class="legend">
        <span><i style="background:var(--sev-0)"></i>Aucune ${stats.countsD.aucune}</span>
        <span><i style="background:var(--sev-1)"></i>Faible ${stats.countsD.faible}</span>
        <span><i style="background:var(--sev-2)"></i>Forte ${stats.countsD.forte}</span>
        <span><i style="background:var(--sev-3)"></i>Très forte ${stats.countsD.tres_forte}</span>
      </div>
    </div>

    <div class="section-title">Calendrier</div>
    <div class="card">
      <div class="date-nav" style="margin-bottom:10px;">
        <button onclick="calShift(-1)">‹</button>
        <div class="date-label" id="cal-label"></div>
        <button id="cal-next-btn" onclick="calShift(1)">›</button>
      </div>
      <div class="cal-grid" style="margin-bottom:6px;">
        <div class="cal-daylabel">L</div><div class="cal-daylabel">M</div><div class="cal-daylabel">M</div><div class="cal-daylabel">J</div><div class="cal-daylabel">V</div><div class="cal-daylabel">S</div><div class="cal-daylabel">D</div>
      </div>
      <div class="cal-grid" id="cal-days"></div>
      <div class="legend">
        <span><i style="background:var(--sev-0)"></i>Aucune</span>
        <span><i style="background:var(--sev-1)"></i>Faible</span>
        <span><i style="background:var(--sev-2)"></i>Forte</span>
        <span><i style="background:var(--sev-3)"></i>Très forte</span>
        <span><i style="background:var(--card);border:1px dashed var(--border)"></i>Non travaillé</span>
      </div>
    </div>

    <p class="empty-hint">Période : ${period0} → ${periodN}. Les trajets non renseignés comptent comme non perturbés.</p>
    <button class="reset-link" onclick="confirmReset()">Réinitialiser toutes les données</button>
  `;

  if(chartC) chartC.destroy();
  if(chartD) chartD.destroy();
  const ctxC = document.getElementById('chartC').getContext('2d');
  const ctxD = document.getElementById('chartD').getContext('2d');
  const cssVar = (name)=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const sevColors = [cssVar('--sev-0'), cssVar('--sev-1'), cssVar('--sev-2'), cssVar('--sev-3')];
  const gridColor = cssVar('--border');
  const tickColor = cssVar('--muted');
  const opts = (counts)=>({
    type:'bar',
    data:{
      labels:['Aucune','Faible','Forte','Très forte'],
      datasets:[{
        data:[counts.aucune, counts.faible, counts.forte, counts.tres_forte],
        backgroundColor:sevColors,
        borderRadius:6,
        borderWidth:0
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true, ticks:{precision:0, font:{size:10}, color:tickColor}, grid:{color:gridColor}},
        x:{ticks:{font:{size:10}, color:tickColor}, grid:{display:false}}
      }
    }
  });
  chartC = new Chart(ctxC, opts(stats.countsC));
  chartD = new Chart(ctxD, opts(stats.countsD));

  await renderCalendarSection();
}

function setWindow(n){
  statsWindow = n;
  renderStats();
}

async function confirmReset(){
  if(!confirm('Supprimer definitivement toutes les donnees enregistrees ?')) return;
  try{
    const snap = await monthsRef.get();
    const batch = db.batch();
    snap.forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
    for(const k in monthCache) delete monthCache[k];
    showToast('Donnees reinitialisees');
    renderStats();
  }catch(e){
    showToast('Erreur lors de la reinitialisation');
  }
}
initApp();
</script>
</body>
</html>
